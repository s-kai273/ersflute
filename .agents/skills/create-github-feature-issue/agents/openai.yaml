interface:
  display_name: "Create GitHub Feature Issue"
  short_description: "Turn feature specifications into GitHub issues"
  default_prompt: "Use $create-github-feature-issue to turn the requested specification into a reviewed GitHub issue."

dependencies:
  tools:
    - type: "mcp"
      value: "github"
      description: "GitHub MCP server"
      transport: "streamable_http"
      url: "https://api.githubcopilot.com/mcp/"

policy:
  allow_implicit_invocation: true
